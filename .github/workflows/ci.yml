name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --dangerously-allow-all-builds
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --dangerously-allow-all-builds
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm --filter @tianshangchat/shared build
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --dangerously-allow-all-builds
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # crypto KATs (RFC vectors) + web core/cache/store units
      - run: pnpm --filter @tianshangchat/crypto test
      - run: pnpm --filter @tianshangchat/web test

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --dangerously-allow-all-builds
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Server vitest resolves @tianshangchat/shared via package entry (dist),
      # so workspace deps must be built in this fresh checkout first.
      - run: pnpm --filter @tianshangchat/shared build
      - run: pnpm --filter @tianshangchat/crypto build
      # Supertest + temp SQLite: auth/messages/groups/sync/e2ee/upload
      - run: pnpm --filter @tianshangchat/server test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --dangerously-allow-all-builds
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [unit, integration, build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tianshangchat/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
